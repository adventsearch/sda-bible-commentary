<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bible Commentary</title>

    <style>
        :root {
            color-scheme: dark;
        }

        body {
            font-family: Georgia, serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #e8e8e8;
            background: #181818;
        }

        h1 {
            text-align: center;
            color: #ffffff;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #dddddd;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            color: #ffffff;
            background: #2a2a2a;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 16px;
        }

        select:disabled {
            color: #888;
            background: #222;
        }

        .verse-navigation {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 15px 0 25px;
        }

        button {
            padding: 10px 18px;
            color: #ffffff;
            background: #3a3a3a;
            border: 1px solid #666;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover:not(:disabled) {
            background: #555;
        }

        button:disabled {
            color: #777;
            background: #252525;
            border-color: #444;
            cursor: not-allowed;
        }

        #commentary {
            padding: 25px;
            background: #242424;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        #commentary h2 {
            margin-top: 0;
            color: #5E79FF;
        }

        #commentary p {
            color: #dddddd;
            white-space: pre-wrap;
        }

        .message {
            color: #999 !important;
            font-style: italic;
        }

        @media (max-width: 700px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .verse-navigation {
                gap: 10px;
            }

            button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <h1>Bible Commentary</h1>

    <div class="controls">
        <div>
            <label for="bookSelect">Book</label>

            <select id="bookSelect">
                <option value="">Select a book</option>
            </select>
        </div>

        <div>
            <label for="chapterSelect">Chapter</label>

            <select id="chapterSelect" disabled>
                <option value="">Select a chapter</option>
            </select>
        </div>

        <div>
            <label for="verseSelect">Verse</label>

            <select id="verseSelect" disabled>
                <option value="">Select a verse</option>
            </select>
        </div>
    </div>

    <div class="verse-navigation">
        <button id="previousVerse" disabled>
            ← Previous verse
        </button>

        <button id="nextVerse" disabled>
            Next verse →
        </button>
    </div>

    <div id="commentary">
        <p class="message">
            Select a book, chapter, and verse to view the commentary.
        </p>
    </div>

    <!-- CSV parsing library -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script>
        let commentaryData = [];

        const bookSelect = document.getElementById("bookSelect");
        const chapterSelect = document.getElementById("chapterSelect");
        const verseSelect = document.getElementById("verseSelect");
        const previousVerseButton = document.getElementById("previousVerse");
        const nextVerseButton = document.getElementById("nextVerse");
        const commentaryBox = document.getElementById("commentary");

        // Rows with a blank chapter (introductions, outlines, and every
        // single-chapter book) are grouped under this key.
        const INTRO = "intro";

        Papa.parse("bible_commentary.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,

            complete: function(results) {
                commentaryData = results.data
                    .filter(row => row.book && row.verse)
                    .map((row, i) => ({
                        _id: String(i),
                        book: row.book.trim(),
                        chapter: (row.chapter || "").trim(),
                        verse: row.verse.trim(),
                        title: row.title,
                        commentary: row.commentary
                    }));

                populateBooks();
            },

            error: function(error) {
                commentaryBox.innerHTML = `
                    <p class="message">
                        Could not load bible_commentary.csv.
                        Make sure it is in the same folder as this HTML file.
                    </p>
                `;
                console.error(error);
            }
        });

        function chapterKey(row) {
            return row.chapter === "" ? INTRO : row.chapter;
        }

        // Rows for a book + chapter. Blank-chapter rows keep file order
        // (verse numbers repeat there); numbered chapters sort by verse.
        function getRows(book, chapter) {
            const rows = commentaryData.filter(row =>
                row.book === book && chapterKey(row) === chapter
            );

            if (chapter !== INTRO) {
                rows.sort((a, b) => Number(a.verse) - Number(b.verse));
            }

            return rows;
        }

        function populateBooks() {
            const books = [...new Set(commentaryData.map(row => row.book))];

            books.forEach(book => {
                const option = document.createElement("option");
                option.value = book;
                option.textContent = book;
                bookSelect.appendChild(option);
            });
        }

        bookSelect.addEventListener("change", function() {
            const selectedBook = bookSelect.value;

            resetSelect(chapterSelect, "Select a chapter");
            resetSelect(verseSelect, "Select a verse");

            chapterSelect.disabled = true;
            verseSelect.disabled = true;
            disableNavigationButtons();

            commentaryBox.innerHTML = `
                <p class="message">
                    Select a chapter and verse to view the commentary.
                </p>
            `;

            if (!selectedBook) {
                return;
            }

            const keys = [...new Set(
                commentaryData
                    .filter(row => row.book === selectedBook)
                    .map(chapterKey)
            )];

            const hasIntro = keys.includes(INTRO);
            const numbered = keys
                .filter(k => k !== INTRO)
                .sort((a, b) => Number(a) - Number(b));

            if (hasIntro) {
                const option = document.createElement("option");
                option.value = INTRO;
                option.textContent = "Introduction";
                chapterSelect.appendChild(option);
            }

            numbered.forEach(chapter => {
                const option = document.createElement("option");
                option.value = chapter;
                option.textContent = `Chapter ${chapter}`;
                chapterSelect.appendChild(option);
            });

            chapterSelect.disabled = false;

            // Auto-load chapter 1, verse 1 (falls back to the first
            // available chapter, then the introduction)
            const startChapter = numbered.includes("1")
                ? "1"
                : (numbered[0] || INTRO);

            chapterSelect.value = startChapter;
            chapterSelect.dispatchEvent(new Event("change"));

            const firstRow = getRows(selectedBook, startChapter)[0];

            if (firstRow) {
                verseSelect.value = firstRow._id;
                displaySelectedVerse();
            }
        });

        chapterSelect.addEventListener("change", function() {
            const selectedBook = bookSelect.value;
            const selectedChapter = chapterSelect.value;

            resetSelect(verseSelect, "Select a verse");
            verseSelect.disabled = true;
            disableNavigationButtons();

            commentaryBox.innerHTML = `
                <p class="message">
                    Select a verse to view the commentary.
                </p>
            `;

            if (!selectedChapter) {
                return;
            }

            getRows(selectedBook, selectedChapter).forEach(row => {
                const option = document.createElement("option");
                option.value = row._id;
                option.textContent = selectedChapter === INTRO
                    ? row.title
                    : `Verse ${row.verse}`;
                verseSelect.appendChild(option);
            });

            verseSelect.disabled = false;
        });

        verseSelect.addEventListener("change", displaySelectedVerse);

        previousVerseButton.addEventListener("click", () => moveToVerse(-1));
        nextVerseButton.addEventListener("click", () => moveToVerse(1));

        function displaySelectedVerse() {
            const row = commentaryData.find(item => item._id === verseSelect.value);

            if (!row) {
                commentaryBox.innerHTML = `
                    <p class="message">Commentary not found.</p>
                `;
                updateNavigationButtons();
                return;
            }

            const heading = row.chapter === ""
                ? `${escapeHtml(row.book)} — ${escapeHtml(row.title)}`
                : `${escapeHtml(row.book)} ${escapeHtml(row.chapter)}:${escapeHtml(row.verse)}` +
                  (row.title ? ` — ${escapeHtml(row.title)}` : "");

            commentaryBox.innerHTML = `
                <h2>${heading}</h2>
                <p>${escapeHtml(row.commentary)}</p>
            `;

            updateNavigationButtons();
        }

        function moveToVerse(direction) {
            const rows = getRows(bookSelect.value, chapterSelect.value);
            const currentIndex = rows.findIndex(row => row._id === verseSelect.value);
            const newIndex = currentIndex + direction;

            if (newIndex >= 0 && newIndex < rows.length) {
                verseSelect.value = rows[newIndex]._id;
                displaySelectedVerse();
            }
        }

        function updateNavigationButtons() {
            const rows = getRows(bookSelect.value, chapterSelect.value);
            const currentIndex = rows.findIndex(row => row._id === verseSelect.value);

            previousVerseButton.disabled = currentIndex <= 0;
            nextVerseButton.disabled =
                currentIndex === -1 || currentIndex >= rows.length - 1;
        }

        function disableNavigationButtons() {
            previousVerseButton.disabled = true;
            nextVerseButton.disabled = true;
        }

        function resetSelect(selectElement, defaultText) {
            selectElement.innerHTML = "";
            const option = document.createElement("option");
            option.value = "";
            option.textContent = defaultText;
            selectElement.appendChild(option);
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>

</body>
</html>
